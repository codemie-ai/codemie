services:
  mermaid-server:
    image: tomwright/mermaid-server:latest
    container_name: mermaid-server
    ports:
      - "8082:80"
    restart: unless-stopped

  codemie:
    extra_hosts:
      #│ Allows to access resources on host machine via http://host.docker.internal
      #│ For example, if you're making HTTP requests to this service, change:                                  │
      #│                                                                                                       │
      #│  • From: http://localhost:10000/api/endpoint                                                          │
      #│  • To: http://host.docker.internal:10000/api/endpoint
      - "host.docker.internal:host-gateway"
    container_name: codemie
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - google_credentials
    volumes:
      - ./src:/app/src
      - ./poetry.lock:/app/poetry.lock
      - ./pyproject.toml:/app/pyproject.toml
      - ./.env:/app/.env
      - ./tests:/app/tests
      - codemie_repos:/app/codemie-repos
      - ./config:/app/config
      - codemie_storage:/app/codemie-storage
    ports:
      - 8080:8080
      - 9091:9091
    restart: on-failure
    environment:
      - ELASTIC_URL=http://elasticsearch:9200
      - PG_URL=postgresql://postgres:password@postgres:5432/postgres
      - KEYCLOAK_LOGOUT_URL=http://localhost:5010/docs
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials.json
    command: poetry run uvicorn codemie.rest_api.main:app --host=0.0.0.0 --port=8080 --reload

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: "docker.elastic.co/elasticsearch/elasticsearch:8.18.4"
    container_name: elasticsearch
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    restart: on-failure
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1024m -Xmx2048m -Dcluster.routing.allocation.disk.watermark.low=94% -Dcluster.routing.allocation.disk.watermark.high=95% -Dcluster.routing.allocation.disk.watermark.flood_stage=95%"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - bootstrap.memory_lock=true
      - allow_partial_search_results=false
    healthcheck:
      test: curl --fail http://localhost:9200/_cat/health || exit 1
      interval: 10s
      timeout: 1s
      retries: 10
    mem_limit: 4g

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI  →  http://localhost:16686
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP  →  set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.4
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - 5601:5601
    restart: on-failure
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  litellm:
    image: ghcr.io/berriai/litellm-database:1.93.0
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ./credentials.json:/app/credentials.json
      - ./src/codemie/enterprise/litellm/litellm_custom_callbacks.py:/app/litellm_custom_callbacks.py
    command:
      - "--config=/app/config.yaml"
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      DIAL_API_KEY: ""
      AWS_DEFAULT_REGION: us-west-2
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      BEDROCK_MANTLE_PROJECT_ID: ""
      VERTEX_PROJECT: ""
      GOOGLE_APPLICATION_CREDENTIALS: "/app/credentials.json"
      # If using Azure OpenAI directly, set these values
      AZURE_TENANT_ID: ""
      AZURE_CLIENT_ID: ""
      AZURE_CLIENT_SECRET: ""
    depends_on:
      - postgres # Indicates that this service depends on the 'db' service, ensuring 'db' starts first
    healthcheck: # Defines the health check configuration for the container
      test: [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 http://localhost:4000/health/liveliness || exit 1",
        ] # Command to execute for health check
      interval: 30s # Perform health check every 30 seconds
      timeout: 10s # Health check command times out after 10 seconds
      retries: 3 # Retry up to 3 times if health check fails
      start_period: 40s # Wait 40 seconds after container start before beginning health checks

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    ports:
      - "4040:4040"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    restart: unless-stopped

  codemie-grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
      - pyroscope
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/plugins:/etc/grafana/provisioning/plugins
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-pyroscope-app
    restart: unless-stopped

  otelcollector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    restart: unless-stopped
    # Run as root so the collector can write the persistent file_storage queue on the
    # root-owned named volume (the contrib image otherwise runs as non-root uid 10001,
    # which cannot create files under /var/lib/otelcollector/queue).
    user: "0:0"
    command: ["--config=/etc/otelcollector/config.yaml"]
    volumes:
      - ./config/otel/config.yaml:/etc/otelcollector/config.yaml:ro
      - otelcollector_queue:/var/lib/otelcollector/queue
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000
      CLICKHOUSE_DATABASE: codemie_analytics
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
    ports:
      # Host ports default to 14317/14318 (offset from standard 4317/4318) to avoid
      # conflicts with a Claude Code session running on the same machine.
      - "${OTLP_GRPC_PORT:-14317}:4317"
      - "${OTLP_HTTP_PORT:-14318}:4318"
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    environment:
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:9000"
      - "8123:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# NOTE: These named volumes replace Windows-incompatible bind mounts (./codemie-storage,
# ./codemie-repos, .elasticsearch_data). If you had data in those host directories,
# migrate it once before running docker compose up:
#   docker run --rm -v ./codemie-storage:/src -v codemie_storage:/dst alpine sh -c "cp -a /src/. /dst/"
#   docker run --rm -v ./codemie-repos:/src -v codemie_repos:/dst alpine sh -c "cp -a /src/. /dst/"
volumes:
  elasticsearch_data:
  postgres_data:
  codemie_storage:
  codemie_repos:
  otelcollector_queue:
  clickhouse_data:

secrets:
  google_credentials:
    # if you don't have gcp credentials but still want to set up local deployment then create an empty file
    # acting as a stub: 'touch ${HOME}/.config/gcloud/application_default_credentials.json'
    file: ${HOME}/.config/gcloud/application_default_credentials.json
