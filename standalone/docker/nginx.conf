server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;
    server_tokens off;

    large_client_header_buffers 4 100k;

    # Uploads: nginx defaults to 1m, which rejects ordinary test/user attachments
    # (a 3.3MB file yields "client intended to send too large body" -> HTTP 413).
    client_max_body_size 100m;

    # Long-running API calls: nginx defaults proxy_read_timeout to 60s, but several
    # endpoints legitimately run longer. POST /v1/assistants/{id}/marketplace/publish
    # executes a multi-call LLM validation workflow (clarification + 4 parallel
    # validations with retries + decision + recommendation phrasing) and was measured
    # at ~97s on gpt-5. At 60s nginx abandoned the request while the backend was still
    # producing a valid 422, so clients received an nginx error page instead of JSON.
    # 300s matches codemie-ui/nginx.local-test.conf, used by the same test harness.
    # Applied at server level so every location below inherits it.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /config.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location ~* \.(html)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # Proxy /api/* to uvicorn on port 8000.
    # The trailing slash on both sides strips the /api prefix —
    # uvicorn sees bare paths (API_ROOT_PATH="").
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
    }

    # Proxy FastAPI docs/openapi endpoints at root so the test harness can
    # reach them at {domain}/docs and {domain}/openapi.json.
    location = /docs {
        proxy_pass         http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /openapi.json {
        proxy_pass         http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Also proxy /v1/* directly so SDK clients that use the domain root
    # (without the /api prefix) reach uvicorn correctly.
    location /v1/ {
        proxy_pass         http://127.0.0.1:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
    }

    # Proxy /code-assistant-api/* to uvicorn, stripping the prefix.
    # The CLI constructs SSO URLs as {orgUrl}/code-assistant-api/v1/... via
    # ensureApiBase(). Stripping the prefix here means uvicorn sees bare /v1/...
    # paths (API_ROOT_PATH=""), mirroring the production reverse-proxy behaviour.
    location /code-assistant-api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;
    }

    location /healthcheck {
        access_log off;
        return 200 'Healthy';
        add_header Content-Type text/plain;
    }
}
