---
components:
  - id: "videoPortal"
    settings:
      name: "EPAM Video Portal"
      enabled: false
      url: "https://example-video-portal.com"
      availableForExternal: false
  - id: "youtubeChannel"
    settings:
      name: "YouTube Channel"
      enabled: true
      url: "https://www.youtube.com/@EPAMAIRunCodeMie"
  - id: "learningCourses"
    settings:
      name: "CodeMie Learning Courses"
      enabled: true
      url: "https://learn.epam.com/catalog?filter=~(isUserContent~false)&search=EPAM%20AI%2FRun%20CodeMie%20in%20Action&sorting=~(~(field~%27RATING~direction~%27desc))&tab=catalog"
      availableForExternal: false
  - id: "userGuide"
    settings:
      name: "Documentation"
      enabled: true
      url: "https://docs.codemie.ai/"
  - id: "userGuideOld"
    settings:
      name: "Documentation"
      enabled: true
      url: "https://docs.google.com/document/d/1T8k-gud6DgpyC3xxtK860x42s9_0c6ED"
  - id: "adminActions"
    settings:
      enabled: true
  - id: "feedbackAssistant"
    settings:
      enabled: false
  - id: "customerSupport"
    settings:
      enabled: true
      availableForExternal: false
      name: "Customer Support"
      url: "https://epa.ms/codemie-support"
  - id: "mcpConnect"
    settings:
      enabled: true
  - id: "skills"
    settings:
      enabled: true
      name: "Skills"
      description: "Modular knowledge units that provide domain-specific instructions to assistants"
  - id: "likeForm"
    settings:
      enabled: true
  - id: "confluenceIntegrationMessage"
    settings:
      enabled: false
  - id: "remoteAssistant"
    settings:
      enabled: false
  - id: "defaultConversationAssistant"
    settings:
      enabled: true
      slug: "ai-run-chatbot"
  - id: "userSurvey"
    settings:
      name: "User Survey Form"
      enabled: false
      availableForExternal: false
      url: "https://testsurvey.com/form"
  - id: "workflowDocumentation"
    settings:
      name: "Documentation"
      enabled: true
      url: "https://docs.codemie.ai/user-guide/workflows/create-workflow"
  - id: "googleDocsDocumentation"
    settings:
      name: "Documentation"
      enabled: true
      url: "https://docs.codemie.ai/user-guide/data-source/datasources-types/add-google-data-source/"
  - id: "workflowYamlDocumentation"
    settings:
      name: "Documentation"
      enabled: true
      url: "https://codemie-ai.github.io/docs/user-guide/workflows/configuration/"
  - id: "applications:technology-copilot"
    settings:
      enabled: true
      description: ""
      name: "Technology Copilot"
      url: "https://technology-qa.epmd-rdr.projects.epam.com/assets/copilot.js"
      type: "module"
      arguments:
        apiUrl: "https://technology-qa.epmd-rdr.projects.epam.com/"
        keycloakConfigPath: "https://technology-qa.epmd-rdr.projects.epam.com/keycloak.json"
  - id: "applications:aice"
    settings:
      enabled: true
      name: "AICE"
      url: "http://localhost:8081"
      type: "iframe"
      description: "Advanced code analysis and exploration solution within the EPAM AI/Run platform"
      icon_url: "https://raw.githubusercontent.com/alk-epam/test-repo/7f9196e4f37ff576f26cda782d785a3941bfce8c/aice.svg"
      created_by: "AICE Team"
  - id: "applications:angular-upgrade-app"
    settings:
      enabled: true
      name: "Angular Upgrade App"
      url: "http://localhost:4173/assets/AngularUpgradeAppRemote.js"
      type: "module"
      description: ""
  - id: "applications:test-mate"
    settings:
      enabled: true
      name: "AI TestMate"
      url: "/aitestmate"
      type: "link"
      description: "Autonomous GenAI solution that automatically generates and commits unit tests, increasing coverage and reducing team effort in software development."
      created_by: "DPEO"
      icon_url: "https://github.com/alk-epam/test-repo/blob/0f6b0e1dde1df59f92aa95a5a40afbb78da87531/ai_testmate_small.png?raw=true"
  - id: "aiAdoption"
    settings:
      enabled: true
      name: "AI Adoption Analytics"
      description: "AI Adoption Framework analytics for measuring and tracking AI maturity across dimensions"
      availableForExternal: false
  - id: "aiChampionsLeaderboard"
    settings:
      enabled: true
      name: "AI Champions Leaderboard"
      description: "Leaderboard analytics showing user AI proficiency scores, tier rankings, and dimension breakdowns"
      availableForExternal: false
  - id: "vendorIntegrationAWS"
    settings:
      enabled: false
  - id: "features:webSearch"
    settings:
      enabled: true
      name: "Web Search"
      description: "Enable web search capabilities including Google Search, Tavily Search, and Web Scraper"
  - id: "features:dynamicCodeInterpreter"
    settings:
      enabled: true
      name: "Code Interpreter"
      description: "Enable Python code execution and data analysis capabilities"
  - id: "features:generatedAssistantIcons"
    settings:
      enabled: true
      name: "Generated Assistant Icons"
      description: "Enable generated icons for assistants"

  - id: "features:userAbilityToCreateProject"
    settings:
      enabled: true

  - id: "features:providersDatasourceImport"
    settings:
      enabled: true
      name: "Import Provider Datasources"
      description: "Enable the admin action to import datasources that already exist on a configured provider (e.g. AICE)"

  - id: "features:costCenters"
    settings:
      enabled: true

  - id: "features:userEnrichmentEnabled"
    settings:
      enabled: false
      name: "Enriched User Dimensions"
      description: "Enable enriched user dimension widgets (country, job title, level) in CLI analytics dashboard"

  - id: "features:favorites"
    settings:
      enabled: true
      name: "Favorites"
      description: "Enable favorite/unfavorite actions for assistants, skills, and workflows"

  - id: "features:pinnedAssistants"
    settings:
      enabled: true
      name: "Pinned Assistants"
      description: "Enable pin/unpin actions for assistants and the pinned assistants sidebar section"

  - id: "features:favoritesPage"
    settings:
      enabled: false
      name: "Favorites Page"
      description: "Enable the dedicated Favorites page and its navigation link"

  - id: "features:requestHedging"
    settings:
      enabled: false
      name: "Request Hedging"
      description: "Race a fast-path tool against the agent pipeline to reduce response latency"
  - id: "features:workflowAI"
    settings:
      enabled: false
      name: "Workflow AI Generation"
      description: "Enable AI-powered workflow generation and refinement from natural language descriptions"
  - id: "features:interactiveElements"
    settings:
      enabled: true
      name: "Interactive Chat Elements"
      description: "Allow assistants to request structured user input via interactive chat elements"
      # Optional catalog override: gate which registered element types each interactive
      # feature exposes to agents, without a code change. Omit to use the built-in
      # registry defaults (core/interactive.py). New element TYPES still require a model
      # in the registry — this only toggles membership of already-registered elements.
      # catalog:
      #   layout: [text, column, row]
      #   features:
      #     action_buttons: [button]
      #     choice: [multiple_choice, dropdown]
      #     short_forms: [text_field, checkbox, date_picker, button]

  - id: "features:personalLiteLLMIntegrations"
    settings:
      enabled: false
      name: "Personal LiteLLM Integrations"
      description: "Enable regular users to manage personal LiteLLM credentials"

  - id: "features:budgetManagement"
    settings:
      enabled: true
      name: "Budget Management"
      description: "Enable budget management features in project and user administration"

  - id: "features:showAllProjects"
    settings:
      enabled: false
      name: "Show All Projects"
      description: "Show all projects in the project selectors regardless of user assignment"

  - id: "mcpCustomServersDisabled"
    settings:
      enabled: false
      name: "MCP Custom Servers Disabled"
      description: "When enabled, restricts users to catalog-referenced MCP servers only. Custom inline MCP server configuration is not permitted."

  - id: "features:sharepointCodeMieOAuth"
    settings:
      enabled: true
      name: "SharePoint CodeMie OAuth"
      description: "Show Sign in with Microsoft (CodeMie Project) authentication option for SharePoint datasource"

  - id: "features:teamsBotIntegration"
    settings:
      enabled: false
      name: "Teams Bot Integration"
      description: "Enable project-level assistant configuration for Microsoft Teams Bot integration."

  - id: "mcpAuthTimeoutSeconds"
    settings:
      enabled: true
      value: 60

  - id: "bannerMessage"
    settings:
      enabled: false
      value: ""

  - id: "bannerLinkLabel"
    settings:
      enabled: false
      value: ""

  - id: "bannerLinkRoute"
    settings:
      enabled: false
      value: ""

