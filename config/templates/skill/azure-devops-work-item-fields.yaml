name: azure-devops-work-item-fields
description: >-
  Reference table of built-in Azure DevOps work-item field REST names (e.g.
  System.Title, System.AssignedTo) for constructing or updating the `fields`
  object passed to Azure DevOps work-item create/update calls. Attaching this
  skill automatically adds the Azure DevOps Work Item toolkit; enabling that
  toolkit on its own does not attach this skill, so pair them explicitly when
  configuring an assistant. Use when creating or updating an ADO work item, or
  when the exact REST reference name of a field is needed.
content: |-
  ## Usage
  Consult this table whenever building or updating the `fields` object for
  `CreateWorkItemTool`/`UpdateWorkItemTool`. Field keys sent to Azure DevOps
  must match the "REST Reference Name" column exactly.

  Source: https://learn.microsoft.com/en-us/azure/devops/boards/work-items/guidance/work-item-field?view=azure-devops

  | Display Name | REST Reference Name |
  |---|---|
  | Acceptance Criteria | `Microsoft.VSTS.Common.AcceptanceCriteria` |
  | Activated By | `Microsoft.VSTS.Common.ActivatedBy` |
  | Activated Date | `Microsoft.VSTS.Common.ActivatedDate` |
  | Activity | `Microsoft.VSTS.Common.Activity` |
  | Area ID | `System.AreaId` |
  | Area Path | `System.AreaPath` |
  | Assigned To | `System.AssignedTo` |
  | Attached File Count | `System.AttachedFileCount` |
  | Automated Test Storage | `Microsoft.VSTS.TCM.AutomatedTestStorage` |
  | Automated Test Type | `Microsoft.VSTS.TCM.AutomatedTestType` |
  | AutomatedTestId | `Microsoft.VSTS.TCM.AutomatedTestId` |
  | AutomatedTestName | `Microsoft.VSTS.TCM.AutomatedTestName` |
  | Automation Status | `Microsoft.VSTS.TCM.AutomationStatus` |
  | Backlog Priority | `Microsoft.VSTS.Common.BacklogPriority` |
  | Blocked | `Microsoft.VSTS.CMMI.Blocked` |
  | Board Column | `System.BoardColumn` |
  | Board Column Done | `System.BoardColumnDone` |
  | Board Lane | `System.BoardLane` |
  | Business Value | `Microsoft.VSTS.Common.BusinessValue` |
  | Change Date | `System.ChangedDate` |
  | Changed By | `System.ChangedBy` |
  | Closed By | `Microsoft.VSTS.Common.ClosedBy` |
  | Closed Date | `Microsoft.VSTS.Common.ClosedDate` |
  | Comment Count | `System.CommentCount` |
  | Committed | `Microsoft.VSTS.CMMI.Committed` |
  | Completed Work | `Microsoft.VSTS.Scheduling.CompletedWork` |
  | Created By | `System.CreatedBy` |
  | Created Date | `System.CreatedDate` |
  | Description | `System.Description` |
  | Discipline | `Microsoft.VSTS.Common.Discipline` |
  | Due Date | `Microsoft.VSTS.Scheduling.DueDate` |
  | Effort | `Microsoft.VSTS.Scheduling.Effort` |
  | Escalate | `Microsoft.VSTS.CMMI.Escalate` |
  | External Link Count | `System.ExternalLinkCount` |
  | Finish Date | `Microsoft.VSTS.Scheduling.FinishDate` |
  | Found In | `Microsoft.VSTS.Build.FoundIn` |
  | History | `System.History` |
  | Hyperlink Count | `System.HyperLinkCount` |
  | ID | `System.Id` |
  | Integration Build | `Microsoft.VSTS.Build.IntegrationBuild` |
