[pytest]
testpaths = tests
pythonpath = src
addopts = --import-mode=importlib -n 3
asyncio_default_fixture_loop_scope = function
env =
    ENV=local
    REPOS_LOCAL_DIR=./codemie-repos
    PG_URL=postgresql://pg:pg123@localhost:111/postgres
    ; Pinned off, like PG_URL above, so the unit suite does not inherit whatever
    ; the operator's `.env` says. This is the value the SHIPPED default carries
    ; (config.py:713), and `pytest tests/` is green under it — every test that
    ; needs the gate on now arms it itself rather than assuming an operator did:
    ;   * in-process tests patch `config.MARKETPLACE_APPROVAL_GATE_ENABLED`
    ;     (test_marketplace_approval_negative.py, test_publish_runs_deterministic_gates.py);
    ;   * the live-container lifecycle chain sets it in `.env`, restarts the
    ;     container and restores both afterwards (the `armed_gate` fixture in
    ;     test_marketplace_approval_lifecycle.py).
    ; Nothing skips when it is off, and nothing silently swaps to the other
    ; publish branch because a developer edited `.env`.
    MARKETPLACE_APPROVAL_GATE_ENABLED=false
markers =
    enterprise: needs the real codemie_enterprise package (the optional extra); runs by default, skipped only with --skip-enterprise (see tests/conftest.py)
    live_stack: needs the running docker stack and an editable .env; opt-in, set RUN_LIVE_STACK_TESTS=1 and run with `pytest -m live_stack`
    live_index: asserts an invariant across the live Postgres and Elasticsearch stack
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
