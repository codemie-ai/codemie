---
# CodeMie Security Policies Configuration
# Version 1.0
#
# This file defines security policies for code execution in shared
# sandbox environments.
#
# The `severity` on each entry below rates how dangerous that operation is.
# It is compared against the configured CODE_EXECUTOR_SECURITY_THRESHOLD, which
# expresses how strict enforcement should be:
#
#   NONE:   enforcement disabled - blocks nothing (SAFE accepted as deprecated alias)
#   LOW:    permissive           - blocks HIGH severity entries only
#   MEDIUM: moderate             - blocks MEDIUM and HIGH severity entries
#   HIGH:   strict               - blocks LOW, MEDIUM and HIGH severity entries
#
# So a higher threshold blocks more. Separately from this threshold (including at NONE), the
# AST layer's hardcoded sandbox-escape detections (exec, eval, __import__, __builtins__) are
# always on — but only on the check_security_policy path (SandboxMode.JOBS). The default
# SandboxMode.SHARED path validates via the sandbox session's own is_safe() check and does not
# invoke the AST layer.

version: "1.0"

# Restricted Python modules
restricted_modules:
  # System operations - HIGH severity
  # os is NOT restricted here — dangerous calls (os.system, os.remove, os.environ)
  # are blocked via the specific patterns below; safe calls like os.urandom,
  # os.path.*, os.getcwd() must remain allowed.
  - name: subprocess
    description: >-
      Process execution - LOW severity for git operations,
      HIGH for others
    severity: HIGH

  - name: sys
    description: >-
      System-specific parameters - restricted for isolation
    severity: HIGH

  # File system operations
  - name: shutil
    description: >-
      High-level file operations - blocked in shared
      environment
    severity: HIGH

  # pathlib is allowed — runtime fs guard enforces workspace boundaries;
  # blocking the import breaks legitimate presentation and data scripts.

  - name: glob
    description: >-
      Unix style pathname pattern expansion - restricted
    severity: MEDIUM

  - name: tempfile
    description: "Temporary file creation - use with caution"
    severity: MEDIUM

  # Network operations
  - name: socket
    description: "Network socket operations - blocked"
    severity: HIGH

  - name: urllib
    description: "URL handling - blocked for security"
    severity: HIGH

  - name: requests
    description: >-
      HTTP library - read operations (GET) allowed with
      low severity
    severity: MEDIUM

  - name: httpx
    description: "HTTP client - blocked"
    severity: HIGH

  # Code execution - HIGH severity
  - name: eval
    description: "Dynamic code evaluation - extremely dangerous"
    severity: HIGH

  - name: exec
    description: "Dynamic code execution - extremely dangerous"
    severity: HIGH

  - name: compile
    description: "Code compilation - blocked"
    severity: HIGH

  # Process/Thread manipulation - HIGH severity
  - name: threading
    description: >-
      Thread-based parallelism - restricted in shared
      environment
    severity: HIGH

  - name: multiprocessing
    description: "Process-based parallelism - blocked"
    severity: HIGH

  # Package installation - HIGH severity
  - name: pip
    description: >-
      Package installer - blocked to prevent runtime dependency
      installation in the sandbox
    severity: HIGH

  # Code inspection - MEDIUM severity
  - name: inspect
    description: "Code introspection - restricted"
    severity: MEDIUM

  - name: importlib
    description: "Dynamic import system - restricted"
    severity: MEDIUM

# Security patterns - regex patterns to detect dangerous code
# constructs
patterns:
  # System command execution
  - pattern: 'os\.system\s*\('
    description: >-
      System command execution - blocked for security
    severity: HIGH

  - pattern: 'subprocess\.(run|call|Popen|check_output)'
    description: >-
      Process execution - LOW severity (allows git and
      system tools)
    severity: HIGH

  # File system manipulation — only deletions are blocked pre-execution;
  # mkdir/makedirs are allowed (runtime fs guard enforces workspace boundaries).
  - pattern: 'os\.(remove|rmdir|unlink)'
    description: "File system deletion - restricted"
    severity: HIGH

  # Network access
  - pattern: 'socket\.socket\s*\('
    description: "Network socket creation - blocked"
    severity: HIGH

  - pattern: 'requests\.(get|post|put|delete)'
    description: "HTTP request - blocked for security"
    severity: MEDIUM

  # Code evaluation
  - pattern: '\beval\s*\('
    description: "Dynamic code evaluation - extremely dangerous"
    severity: HIGH

  - pattern: '\bexec\s*\('
    description: "Dynamic code execution - extremely dangerous"
    severity: HIGH

  # Environment manipulation
  - pattern: 'os\.environ\['
    description: "Environment variable modification - restricted"
    severity: HIGH

  # Dangerous builtins
  - pattern: '__builtins__'
    description: "Access to builtins - potential security risk"
    severity: HIGH
