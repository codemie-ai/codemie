include:
  - project: "epm-cdme/codemie-gitlab-templates"
    ref: "0.1.2"
    file: "/templates/pre-ci-guard.yml"

workflow:
  auto_cancel:
    on_new_commit: interruptible

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - pre-ci-guard

no-op:
  stage: pre-ci-guard
  script:
    - echo "Skipping CI guards for non-main target branch"
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"'

check-alembic-heads:
  stage: pre-ci-guard
  image: alpine:3.23.5
  interruptible: true
  timeout: 5m
  variables:
    GIT_DEPTH: "1"
  before_script:
    - apk add --no-cache git python3
  script:
    - git fetch --depth 1 origin "+refs/heads/main:refs/remotes/origin/main"
    - python3 scripts/check_alembic_heads.py --merge-with origin/main
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

wait-ci-init:
  extends: .wait-ci-init-template

  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

  variables:
    EXPECTED_CONTEXTS: |
      ci-pipeline
      compliance-report
