# clamd runs in its own pod and listens on the pod network; a NetworkPolicy admits only the validator pods
# (kubernetes.yaml, or the chart's clamd-networkpolicy.yaml). TCPAddr is not part of the validation policy.
Foreground yes
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
LocalSocketGroup clamav
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
User clamav
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 600M
MaxRecursion 20
MaxFiles 5102
AlertExceedsMax yes
ScanArchive yes
ScanHTML yes
ScanPE yes
MaxScanTime 300000
MaxThreads 2
MaxQueue 8
CommandReadTimeout 10
ReadTimeout 15
SendBufTimeout 10000
SelfCheck 3600
ConcurrentDatabaseReload no
