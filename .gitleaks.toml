title = "Gitleaks configuration for Codemie"

[extend]
useDefault = true

[allowlist]
description = "Allowlisted files"
paths = [
  '''config/index-dumps/.*\.json$''',  # Index dumps contain sample data
  '''.*/__pycache__/.*''',             # Compiled Python bytecode (gitignored, contains test mock keys)
  '''.pytest_cache/.*''',              # pytest cache (gitignored, mirrors test param strings)
  '''.idea/.*''',                      # IDE workspace files (gitignored, UUIDs trigger generic-api-key)
  '''.keys/.*''',                      # Local dev keys (gitignored, never committed)
  '''.env_local''',                    # Local environment variables (gitignored, never committed)
  '''.env\.local''',                   # Local environment variables (gitignored, never committed)
  '''(^|/)\.env$''',                   # Local environment variables (gitignored, never committed)
  '''htmlcov/.*''',                    # Coverage HTML output (gitignored, renders test source as HTML)
  '''.venv/.*''',
  '''.vscode/.*''',
  '''tests/codemie/datasource/loader/fixtures/xlsb/.*\.xlsb$''',  # Binary Excel test fixtures; password-protected workbook stores encryption key material (encryptedHmacKey/encryptedKeyValue), not real secrets
]

stopwords = [
  "limit=self.MAX_RESULTS",  # False positive: parameter assignment, not a secret
  "finish_reason=length",    # False positive: OpenAI API response field in test/doc strings
]
