# Default values for codemie.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- The number of AI/Run API pods to run
replicaCount: 1

## AI/Run API image
image:
  # -- Repository to use for the AI/Run API
  repository: ""
  # -- Image pull policy for the AI/Run API
  pullPolicy: IfNotPresent
  # -- Tag to use for the AI/Run API. Overrides the image tag whose default is the chart appVersion
  tag: ""

## Use Argo Rollouts for deployment
argoRollout:
  # -- Enable Argo Rollouts instead of standard Kubernetes deployment
  enabled: false
  # -- The time to wait before scaling down the old replica set
  # Default: 120 seconds = 2 minutes
  scaleDownDelaySeconds: 120

# -- Secrets with credentials to pull images from a private registry
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- List of extra environment variables to be used by the AI/Run API
# @default -- `[]`
extraEnv:
  # IMPORTANT: IF YOU ARE MAKING CHANGES IN THIS SECTION RUN `helm-docs` from project root to update README.md
  - name: "AZURE_OPENAI_API_KEY"
    valueFrom:
      secretKeyRef:
        key: key
        name: secret-azure-openai-api-key

  - name: AZURE_OPENAI_URL
    value: ""
  - name: MODELS_ENV
    value: ""

  - name: ENV
    value: "dev"
  - name: IDP_PROVIDER
    value: 'keycloak'
  - name: ENCRYPTION_TYPE
    value: "gcp"
  - name: API_ROOT_PATH
    value: "/code-assistant-api"
  - name: FILES_STORAGE_TYPE
    value: "gcp"
  - name: TRIGGER_ENGINE_ENABLED
    value: "false"
  - name: SUBWORKFLOW_MAX_NESTING_DEPTH
    value: "1"
  - name: SUBWORKFLOW_POOL_ENABLED
    value: "false"

  - name: 'GOOGLE_SEARCH_API_KEY'
    valueFrom:
      secretKeyRef:
        name: codemie-api-search-secrets
        key: google_search_api_key
  - name: 'GOOGLE_SEARCH_CSE_ID'
    valueFrom:
      secretKeyRef:
        name: codemie-api-search-secrets
        key: google_search_cse_id
  - name: 'TAVILY_API_KEY'
    valueFrom:
      secretKeyRef:
        name: codemie-api-search-secrets
        key: tavily_api_key

  - name: 'AWS_ACCESS_KEY_ID'
    valueFrom:
      secretKeyRef:
        name: aws-secrets
        key: aws_access_key_id
  - name: 'AWS_SECRET_ACCESS_KEY'
    valueFrom:
      secretKeyRef:
        name: aws-secrets
        key: aws_secret_access_key
  - name: 'AWS_DEFAULT_REGION'
    value: "us-west-2"

  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: "/secrets/gcp-service-account.json"
  - name: GOOGLE_PROJECT_ID
    value: ""
  - name: GOOGLE_REGION
    value: "europe-west3"
  - name: GOOGLE_KMS_PROJECT_ID
    value: ""
  - name: GOOGLE_KMS_REGION
    value: "europe-west3"
  - name: GOOGLE_VERTEXAI_REGION
    value: "us-central1"
  - name: GOOGLE_CLAUDE_VERTEXAI_REGION
    value: "us-east5"

  # HashiCorp Vault configuration
  - name: VAULT_URL
    value: ""  # Example: http://vault.example.com:8200
  - name: VAULT_TOKEN
    valueFrom:
      secretKeyRef:
        name: vault-credentials
        key: token
        optional: true
  - name: VAULT_NAMESPACE
    value: ""  # Optional: for Vault Enterprise
  - name: VAULT_TRANSIT_KEY_NAME
    value: "codemie"
  - name: VAULT_TRANSIT_MOUNT_POINT
    value: "transit"

  - name: DALLE_API_URL
    value: ""
  - name: DALLE_API_KEY
    valueFrom:
      secretKeyRef:
        name: secret-dalle-api-key
        key: key


  - name: AZURE_SPEECH_REGION
    value: "westus2"
  - name: AZURE_SPEECH_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: secret-azure-speech-service-api-key
        key: key

  - name: STT_API_DEPLOYMENT_NAME
    value: "whisper"
  - name: STT_MODEL_NAME
    value: "whisper"
  - name: STT_API_URL
    value: ""
    # Dalle API key is used because Whisper model is deployed to the same cognitive service in Azure
  - name: STT_API_KEY
    valueFrom:
      secretKeyRef:
        name: secret-dalle-api-key
        key: key

  - name: GITHUB_IDENTIFIERS
    value: '["github"]'
  - name: GITLAB_IDENTIFIERS
    value: '["gitlab"]'
  - name: BITBUCKET_IDENTIFIERS
    value: '["bitbucket"]'

  # Hosted applications (EPMCDME-16001) are off until the customer-config feature
  # features:hostedApplications is on (FEATURE_HOSTED_APPLICATIONS overrides it). They also need a
  # separate content domain with wildcard DNS/TLS, the validator pod, a shared RWX volume mounted through
  # extraVolumes/extraVolumeMounts, and user management (ENABLE_USER_MANAGEMENT=true; any IDP_PROVIDER
  # works). Runbook and objects: hosted-applications/README.md and kubernetes.yaml
  # - name: FEATURE_HOSTED_APPLICATIONS
  #   value: "true"
  # - name: HOSTED_APPS_CONTENT_DOMAIN
  #   value: "apps-content.example.net"
  # - name: HOSTED_APPS_STORAGE_DIR
  #   value: "/mnt/hosted-applications"
  # The validator runs in features.tools.hosted-apps.namespace.name, so use the namespace-qualified name:
  # - name: HOSTED_APPS_VALIDATOR_URL
  #   value: "http://codemie-hosted-apps-validator.codemie-hosted-apps.svc:8091"
  # - name: HOSTED_APPS_CREDENTIAL_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: codemie-hosted-applications
  #       key: credential-secret
  # - name: HOSTED_APPS_VALIDATOR_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: codemie-hosted-applications
  #       key: validator-key

# -- List of custom extra environment variables to be used by the AI/Run API
# Use this to add or override environment variables
# @default -- `[]`
customEnv:
  - name: 'ELASTIC_USERNAME'
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: username
  - name: 'ELASTIC_PASSWORD'
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password
  - name: 'ELASTIC_URL'
    value: "https://elasticsearch-master.codemie-elastic-dev.svc.cluster.local:9200"
  - name: 'KEYCLOAK_LOGOUT_URL'
    value: ''
  - name: LOG_LEVEL
    value: 'debug'
  - name: NATS_PLUGIN_KEY_CHECK_ENABLED
    value: "true"
  - name: NATS_SKIP_TLS_VERIFY
    value: "false"
  # Secret 'codemie-nats-secrets' is provided by the codemie-nats helm chart
  - name: NATS_SERVERS_URI
    valueFrom:
      secretKeyRef:
        name: codemie-nats-secrets
        key: NATS_URL
  - name: NATS_USER
    valueFrom:
      secretKeyRef:
        name: codemie-nats-secrets
        key: CODEMIE_USERNAME
  - name: NATS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: codemie-nats-secrets
        key: CODEMIE_PASSWORD

  # MCP_INSTRUCTIONS_NONCE_SECRET keys the delimiters around MCP server instructions in the system prompt.
  # Set the same value on every API replica (at least 32 characters, e.g. `openssl rand -hex 32`) so a
  # conversation keeps the same prompt across pods and restarts. Unset, each pod uses its own key,
  # which breaks provider prompt caching and logs a warning once per pod. The value is checked at startup.
  # Enable only after creating the secret, because a missing secretKeyRef stops the pods from starting:
  # - name: MCP_INSTRUCTIONS_NONCE_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: codemie-mcp-secrets
  #       key: MCP_INSTRUCTIONS_NONCE_SECRET

  # Tolerations for Code Executor sandbox Job pods (sandbox-jobs mode only).
  # Independent from the top-level `tolerations` value below, which applies only to the
  # AI/Run API pod itself, not to executor Job pods created at runtime.
  # - name: CODE_EXECUTOR_RUNTIME_CLASS_NAME
  #   value: "kata-vm-isolation"
  # - name: CODE_EXECUTOR_TOLERATIONS
  #   value: '[{"key":"runtime","operator":"Equal","value":"kata-vm-isolation","effect":"NoSchedule"}]'

features:
  tools:
    code_executor:
      namespace:
        # -- Create the namespace where executor pods run. Set to true only if it doesn't already exist
        create: false
        # -- Namespace where executor pods run (must match CODE_EXECUTOR_NAMESPACE env var)
        name: "codemie-code-executor"
      # -- Create Role and RoleBinding in features.tools.code_executor.namespace.name to allow the service account to manage executor pods
      rbac:
        enabled: false
    hosted-apps:
      # -- Enable hosted applications resources
      enabled: false
      namespace:
        # -- Create the namespace for hosted applications resources. Set to true only if it doesn't already exist
        create: false
        # -- Namespace for hosted applications resources
        name: "codemie-hosted-apps"
      # clamd configuration, mounted into both the validator and clamd at /etc/clamav/clamd.conf
      clamdConfig:
        # -- Name of an existing ConfigMap with the clamd configuration under the clamd.conf key. When empty,
        # the chart creates codemie-hosted-apps-clamd
        existingConfigMap: ""
      validator:
        image:
          # -- Repository of the hosted applications validator image (built from Dockerfile.validator)
          repository: ""
          # -- Image pull policy for the validator
          pullPolicy: IfNotPresent
          # -- Validator image tag. Defaults to image.tag (the API image tag), then to the chart appVersion
          tag: ""
        # -- Environment variables for the validator container
        env:
          - name: VALIDATOR_BIND_HOST
            value: "0.0.0.0"
          - name: VALIDATOR_SERVICE_KEY
            valueFrom:
              secretKeyRef:
                name: codemie-hosted-applications
                key: validator-key
          - name: CLAMD_HOST
            value: "codemie-hosted-apps-clamd"
          - name: CLAMD_PORT
            value: "3310"
          - name: CLAMD_CONFIGURATION
            value: "/etc/clamav/clamd.conf"
        # -- Mount the service account token into the validator pod
        automountServiceAccountToken: false
        # -- Inject Service environment variables into the validator pod
        enableServiceLinks: false
        # -- Image pull secrets for the validator pod. Defaults to the top-level imagePullSecrets
        imagePullSecrets: []
        # -- Priority class for the validator pod
        priorityClassName: ""
        # -- Node selector for the validator pod
        nodeSelector: {}
        # -- Affinity rules for the validator pod
        affinity: {}
        # -- Tolerations for the validator pod
        tolerations: []
        # -- Pod security context for the validator pod
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        # -- Security context for the validator container
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        # -- Readiness probe for the validator container
        readinessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
        # -- Liveness probe for the validator container
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        # -- Resources for the validator container
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        # -- Extra volume mounts for the validator container
        volumeMounts:
          - name: work
            mountPath: /work
        # -- Extra volumes for the validator pod
        volumes:
          - name: work
            emptyDir:
              sizeLimit: 2Gi
      clamd:
        image:
          # -- Repository of the ClamAV image
          repository: "clamav/clamav"
          # -- Image pull policy for ClamAV
          pullPolicy: IfNotPresent
          # -- ClamAV image tag, pinned by digest
          tag: "1.5.4_base@sha256:58168cd4f48a118c7d20b76da8ffce97e579b84ed7e6d1e977c6e22b1e989c5a"
        # -- clamd TCP port (must match TCPSocket in clamd.conf and CLAMD_PORT in validator.env)
        port: 3310
        # -- Mount the service account token into the clamd pod
        automountServiceAccountToken: false
        # -- Inject Service environment variables into the clamd pod
        enableServiceLinks: false
        # -- Image pull secrets for the clamd pod. Defaults to the top-level imagePullSecrets
        imagePullSecrets: []
        # -- Priority class for the clamd pod
        priorityClassName: ""
        # -- Node selector for the clamd pod. The pinned upstream image is amd64-only
        nodeSelector: {}
        # -- Affinity rules for the clamd pod
        affinity: {}
        # -- Tolerations for the clamd pod
        tolerations: []
        # -- Pod security context for the clamd pod
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        # -- Environment variables for the clamd container. TZ=UTC is required: clamd reports its signature date in
        # local time and the validator reads it as UTC
        env:
          - name: TZ
            value: "UTC"
          - name: FRESHCLAM_CHECKS
            value: "4"
        # -- Security context for the clamd container
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
        # -- Startup probe for the clamd container. Signature load takes minutes after every start
        startupProbe:
          exec:
            command: ["clamdscan", "--config-file=/etc/clamav/clamd.conf", "--ping=1"]
          periodSeconds: 10
          failureThreshold: 60
        # -- Liveness probe for the clamd container. Checks that clamd answers and freshclam is running
        livenessProbe:
          initialDelaySeconds: 60
          exec:
            command:
              - /bin/sh
              - -c
              - |
                clamdscan --config-file=/etc/clamav/clamd.conf --ping=1 || { echo "clamd is not responding"; exit 1; }
                live=0
                for pid in $(pgrep freshclam); do
                  stat=$(cat /proc/$pid/stat 2>/dev/null) || continue
                  state=$(printf '%s' "$stat" | awk '{print $3}')
                  if [ "$state" != "Z" ]; then
                    live=1
                    break
                  fi
                done
                [ "$live" = "1" ] || { echo "freshclam is not running"; exit 1; }
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        # -- Resources for the clamd container
        resources:
          requests:
            cpu: "1"
            memory: 1536Mi
          limits:
            cpu: "1"
            memory: 3Gi
        # -- Extra volume mounts for the clamd container
        volumeMounts:
          - name: signatures
            mountPath: /var/lib/clamav
          - name: clamd-run
            mountPath: /run/clamav
        # -- Extra volumes for the clamd pod
        volumes:
          - name: signatures
            emptyDir:
              sizeLimit: 2Gi
          - name: clamd-run
            emptyDir:
              sizeLimit: 1Mi
      # Ingress for the content domain, created in the release namespace
      ingress:
        # -- Create the hosted applications content Ingress
        enabled: true
        # -- Ingress class name
        ingressClassName: "nginx"
        # -- Wildcard host of the content domain, e.g. "*.apps-content.example.net"
        host: ""
        # -- Additional ingress annotations
        annotations: {}
        # -- Ingress TLS configuration
        tls: []
      networkPolicy:
        # -- Create NetworkPolicies for the validator pod and clamd egress, plus a default-deny ingress policy when
        # the hosted applications namespace differs from the release namespace. The policy that admits only the
        # validator to clamd's unauthenticated port is created whenever hosted-apps is enabled. Needs a CNI that
        # enforces NetworkPolicy
        enabled: true
        egress:
          # -- Where the validator and clamd may send DNS queries (port 53). Empty allows any destination,
          # which also covers GKE NodeLocal DNSCache
          dns: []
          # -- Where clamd may download signatures from (port 443). Defaults to the internet without the cluster
          # ranges and link-local addresses
          clamd:
            - ipBlock:
                cidr: 0.0.0.0/0
                except:
                  - "10.92.249.0/26"
                  - "10.92.202.160/28"
                  - "172.20.0.0/16"
                  - "172.21.0.0/17"
                  - "172.30.0.0/16"
                  - "169.254.0.0/16"

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations applied to created service account
  annotations: {}
  # -- Service account name for AI/Run API pod
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Toggle automatic mounting of the service account token.
  automountServiceAccountToken: true

# -- Annotations to be added to AI/Run API pods
podAnnotations: {}

# -- Labels to be added to AI/Run UI pods.
podLabels: {}

# -- Toggle and define pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

# -- AI/Run API container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- AI/Run API service type
  type: ClusterIP
  # -- AI/Run API service port
  port: 8080
  # -- AI/Run API service annotations
  annotations: {}

# -- Prometheus metrics server configuration
metrics:
  # -- Enable Prometheus metrics scraping endpoint
  enabled: false
  # -- The port the metrics server listens on
  port: 9091

## AI/Run API ingress configuration
ingress:
  # -- Enable an ingress resource for the AI/Run API
  enabled: true
  # -- Additional ingress annotations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: 900m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # Hosted applications artifact uploads need proxy-read-timeout and proxy-send-timeout of at least
    # 900 seconds and proxy-body-size of at least 110m.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"
  # -- Ingress path type
  pathType: ImplementationSpecific
  # -- AI/Run API hostname
  host: codemie.%%DOMAIN%%
  # -- The path to AI/Run API
  path: "/code-assistant-api/(.*)"
  tls: []

## AI/Run API ingress configuration for Swagger
ingressSwagger:
  # -- Additional ingress annotations
  annotations: {}
  # -- Ingress path type
  pathType: ImplementationSpecific
  # -- The path to AI/Run API for Swagger
  path: "/openapi.json"

## AI/Run API ingress configuration for Webhooks
ingressWebHooks:
  # -- Additional ingress annotations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /v1/webhooks/$1
  # -- Ingress path type
  pathType: ImplementationSpecific
  # -- The path to AI/Run API for Webhooks
  path: "/code-assistant-api/v1/webhooks/(.*)"

## AI/Run API ingress configuration for Callbacks Index
ingressCallbacksIndex:
  # -- Additional ingress annotations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /v1/callbacks/index/$1
  # -- Ingress path type
  pathType: ImplementationSpecific
  # -- The path to AI/Run API for Callbacks Index
  path: "/code-assistant-api/v1/callbacks/index/(.*)"

## AI/Run API ingress configuration for OAuth client metadata (public discovery endpoint, no auth)
ingressOauthClientMetadata:
  # -- Additional ingress annotations
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /oauth/client-metadata.json
  # -- Ingress path type
  pathType: ImplementationSpecific
  # -- The path to AI/Run API for OAuth client metadata
  path: "/code-assistant-api/oauth/client-metadata.json"

## Dedicated ds-pool processing workload
dsPool:
  # -- Enable a separate deployment/rollout for ds-pool processing
  enabled: false
  # -- Number of ds-pool pods to run
  replicaCount: 1

  ## Use Argo Rollouts for the ds-pool workload
  argoRollout:
    # -- Enable Argo Rollouts instead of standard Kubernetes Deployment for ds-pool
    enabled: false
    # -- The time to wait before scaling down the old replica set
    scaleDownDelaySeconds: 120

  # -- Additional env vars merged after extraEnv + customEnv (e.g. DATASOURCE_WORKER_ONLY=true)
  # @default -- `[]`
  extraEnv: []

  # -- Resource limits and requests for ds-pool pods
  resources:
    limits:
      cpu: 2
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 1024Mi

  service:
    # -- ds-pool service type
    type: ClusterIP
    # -- ds-pool service port
    port: 8080
    # -- ds-pool service annotations
    annotations: {}

  ingress:
    # -- Enable ingress for the ds-pool workload
    enabled: false
    # -- Additional ingress annotations
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /v1/index/$1
      nginx.ingress.kubernetes.io/proxy-body-size: 900m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # -- Ingress path type
    pathType: ImplementationSpecific
    # -- Path routed to the ds-pool service (all /v1/index/* endpoints)
    path: "/code-assistant-api/v1/index/(.*)"

  ingressApp:
    # -- Enable ingress for application index endpoints
    enabled: false
    # -- Additional ingress annotations
    annotations:
      nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-Access-Token,Authorization
      nginx.ingress.kubernetes.io/auth-signin: https://$host/oauth2/start?rd=$escaped_request_uri
      nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:80/oauth2/auth
      nginx.ingress.kubernetes.io/rewrite-target: /v1/application/$1/index$2
      nginx.ingress.kubernetes.io/proxy-body-size: 900m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # -- Ingress path type
    pathType: ImplementationSpecific
    # -- Path routed to the ds-pool service (/v1/application/*/index* endpoints)
    path: "/code-assistant-api/v1/application/(.*)/index(.*)"

  ## HPA for the ds-pool workload
  hpa:
    # -- Enable the HorizontalPodAutoscaler for the ds-pool rollout/deployment
    enabled: false
    # -- Minimum number of ds-pool pods
    minReplicas: 1
    # -- Maximum number of ds-pool pods
    maxReplicas: 2
    # -- Target CPU utilization of the codemie container, as a percentage of its CPU request
    targetCPUUtilizationPercentage: 70
    # -- Time window the CPU target must be exceeded before pods are added
    scaleUpStabilizationWindowSeconds: 60
    # -- Maximum number of pods the HPA can add per scaleUpPolicyPeriodSeconds window
    scaleUpPolicyPods: 1
    # -- Time window for the scaleUpPolicyPods limit
    scaleUpPolicyPeriodSeconds: 15
    # -- Time window CPU must stay below target before pods are removed
    scaleDownStabilizationWindowSeconds: 1800
    # -- Maximum number of pods the HPA can remove per scaleDownPolicyPeriodSeconds window
    scaleDownPolicyPods: 1
    # -- Time window for the scaleDownPolicyPods limit
    scaleDownPolicyPeriodSeconds: 600

  ## PodDisruptionBudget for the ds-pool workload
  pdb:
    # -- Enable the PodDisruptionBudget for the ds-pool rollout/deployment
    enabled: false
    # -- Minimum number of pods that must remain available during a disruption.
    # Mutually exclusive with maxUnavailable; set only one.
    minAvailable: 1
    # -- Maximum number of pods that can be unavailable during a disruption.
    # Mutually exclusive with minAvailable; set only one (leave empty to use minAvailable).
    maxUnavailable: ""

## Dedicated proxy-pool workload
## Handles LiteLLM proxy traffic (chat, completions, messages, embeddings, models, health, Gemini endpoints).
## Exposes a service and ingress with one path per proxy endpoint.
proxyPool:
  # -- Enable a separate deployment/rollout for proxy-pool processing
  enabled: false
  # -- Number of proxy-pool pods to run
  replicaCount: 1

  ## Use Argo Rollouts for the proxy-pool workload
  argoRollout:
    # -- Enable Argo Rollouts instead of standard Kubernetes Deployment for proxy-pool
    enabled: false
    # -- The time to wait before scaling down the old replica set
    scaleDownDelaySeconds: 120

  # -- Additional env vars merged after extraEnv + customEnv
  # @default -- `[]`
  extraEnv: []

  # -- Resource limits and requests for proxy-pool pods
  resources:
    limits:
      cpu: 2
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 1024Mi

  service:
    # -- proxy-pool service type
    type: ClusterIP
    # -- proxy-pool service port
    port: 8080
    # -- proxy-pool service annotations
    annotations: {}

  ingress:
    # -- Enable ingress for the proxy-pool workload
    enabled: false
    # -- Additional ingress annotations
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 900m
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    # -- Ingress path type
    pathType: ImplementationSpecific
    # -- Paths routed to the proxy-pool service (all LiteLLM proxy endpoints)
    paths:
      # Chat & Completions (OpenAI-compatible)
      - path: "/v1/chat/completions"
      - path: "/chat/completions"
      - path: "/v1/completions"
      - path: "/completions"
      # Messages (Claude/Anthropic API)
      - path: "/v1/messages"
      - path: "/messages"
      - path: "/v1/messages/count_tokens"
      - path: "/messages/count_tokens"
      # Responses (Codex CLI)
      - path: "/v1/responses"
      - path: "/responses"
      # Embeddings
      - path: "/v1/embeddings"
      - path: "/embeddings"
      # Health & Models
      - path: "/v1/health"
      - path: "/health"
      - path: "/v1/models"
      - path: "/models"
      # Google/Gemini API endpoints
      - path: "/v1/models/(.*):generateContent"
      - path: "/models/(.*):generateContent"
      - path: "/v1/models/(.*):streamGenerateContent"
      - path: "/models/(.*):streamGenerateContent"
      - path: "/v1/models/(.*):countTokens"
      - path: "/models/(.*):countTokens"
      # v1beta Gemini endpoints
      - path: "/v1beta/models/(.*):generateContent"
      - path: "/v1beta/models/(.*):streamGenerateContent"

  ## HPA for the proxy-pool workload
  hpa:
    # -- Enable the HorizontalPodAutoscaler for the proxy-pool rollout/deployment
    enabled: false
    # -- Minimum number of proxy-pool pods
    minReplicas: 1
    # -- Maximum number of proxy-pool pods
    maxReplicas: 2
    # -- Target CPU utilization of the codemie container, as a percentage of its CPU request
    targetCPUUtilizationPercentage: 70
    # -- Time window the CPU target must be exceeded before pods are added
    scaleUpStabilizationWindowSeconds: 60
    # -- Maximum number of pods the HPA can add per scaleUpPolicyPeriodSeconds window
    scaleUpPolicyPods: 1
    # -- Time window for the scaleUpPolicyPods limit
    scaleUpPolicyPeriodSeconds: 15
    # -- Time window CPU must stay below target before pods are removed
    scaleDownStabilizationWindowSeconds: 1800
    # -- Maximum number of pods the HPA can remove per scaleDownPolicyPeriodSeconds window
    scaleDownPolicyPods: 1
    # -- Time window for the scaleDownPolicyPods limit
    scaleDownPolicyPeriodSeconds: 600

  ## PodDisruptionBudget for the proxy-pool workload
  pdb:
    # -- Enable the PodDisruptionBudget for the proxy-pool rollout/deployment
    enabled: false
    # -- Minimum number of pods that must remain available during a disruption.
    # Mutually exclusive with maxUnavailable; set only one.
    minAvailable: 1
    # -- Maximum number of pods that can be unavailable during a disruption.
    # Mutually exclusive with minAvailable; set only one (leave empty to use minAvailable).
    maxUnavailable: ""

## Probes for the AI/Run API
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
#
# Hosted applications: with HOSTED_APPS_CONTENT_DOMAIN set, the API routes by Host. Kubelet probes address
# the pod IP, which is outside the content namespace, so these httpGet probes keep reaching the API.
#
# Is used to avoid pod restarts when the pod is starting when we are executing the migration script.
# Pod has 2400 seconds to start and execute the migration script.
# failureThreshold * periodSeconds = 240 * 10 = 2400 seconds = 40 minutes
startupProbe:
  httpGet:
    path: /v1/healthcheck
    port: 8080
  # -- Number of seconds after the container has started before probe is initiated
  initialDelaySeconds: 20
  # -- Minimum consecutive failures for the probe to be considered failed after having succeeded
  failureThreshold: 240
  # -- How often (in seconds) to perform the probe
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /v1/healthcheck
    port: 8080
  # -- Minimum consecutive failures for the probe to be considered failed after having succeeded
  failureThreshold: 3
  # -- Number of seconds after the container has started before probe is initiated
  initialDelaySeconds: 20
  # -- How often (in seconds) to perform the probe
  periodSeconds: 30
  # -- Minimum consecutive successes for the probe to be considered successful after having failed
  successThreshold: 1
  # -- Number of seconds after which the probe times out
  timeoutSeconds: 10

readinessProbe:
  httpGet:
    path: /v1/healthcheck
    port: 8080
  # -- Minimum consecutive failures for the probe to be considered failed after having succeeded
  failureThreshold: 3
  # -- Number of seconds after the container has started before probe is initiated
  initialDelaySeconds: 20
  # -- How often (in seconds) to perform the probe
  periodSeconds: 30
  # -- Minimum consecutive successes for the probe to be considered successful after having failed
  successThreshold: 1
  # -- Number of seconds after which the probe times out
  timeoutSeconds: 10

## HPA for the main codemie-api workload
hpa:
  # -- Enable the HorizontalPodAutoscaler for the codemie-api rollout/deployment
  enabled: false
  # -- Minimum number of codemie-api pods
  minReplicas: 1
  # -- Maximum number of codemie-api pods
  maxReplicas: 2
  # -- Target CPU utilization of the codemie container, as a percentage of its CPU request
  targetCPUUtilizationPercentage: 70
  # -- Time window the CPU target must be exceeded before pods are added
  scaleUpStabilizationWindowSeconds: 60
  # -- Maximum number of pods the HPA can add per scaleUpPolicyPeriodSeconds window
  scaleUpPolicyPods: 1
  # -- Time window for the scaleUpPolicyPods limit
  scaleUpPolicyPeriodSeconds: 15
  # -- Time window CPU must stay below target before pods are removed
  scaleDownStabilizationWindowSeconds: 1800
  # -- Maximum number of pods the HPA can remove per scaleDownPolicyPeriodSeconds window
  scaleDownPolicyPods: 1
  # -- Time window for the scaleDownPolicyPods limit
  scaleDownPolicyPeriodSeconds: 600

## PodDisruptionBudget for the main codemie-api workload
pdb:
  # -- Enable the PodDisruptionBudget for the codemie-api rollout/deployment
  enabled: false
  # -- Minimum number of pods that must remain available during a disruption.
  # Mutually exclusive with maxUnavailable; set only one.
  minAvailable: 1
  # -- Maximum number of pods that can be unavailable during a disruption.
  # Mutually exclusive with minAvailable; set only one (leave empty to use minAvailable).
  maxUnavailable: ""

# -- Resource limits and requests for the AI/Run API pods
resources:
  limits:
    cpu: 2
    memory: 8Gi
  requests:
    cpu: 1
    memory: 8Gi

# -- Mapping between IP and hostnames that will be injected as entries in the pod's hosts files
hostAliases: []

# -- Priority class for the AI/Run API pods
priorityClassName: ""

# -- Whether to inject service links into pod environment variables
enableServiceLinks: false

# -- Node selector to be added to the AI/Run API pods
nodeSelector: {}

# -- Tolerations to be added to the AI/Run API pods. Applies only to the API Deployment/Rollout;
# does not affect Code Executor sandbox Job pods, which are configured separately via
# CODE_EXECUTOR_TOLERATIONS (see the `customEnv` example above)
tolerations: []

# -- Assign affinity rules to the deployment
affinity: {}

# -- List of extra mounts to add (normally used with extraVolumes)
extraVolumeMounts: |
  - name: google-service-account
    readOnly: true
    mountPath: "/secrets/gcp-service-account.json"
    subPath: gcp-service-account.json
  - name: codemie-customer-config
    mountPath: /app/config/customer

# -- List of extra volumes to add
extraVolumes: |
  - name: google-service-account
    secret:
      secretName: google-service-account
  - name: codemie-customer-config
    configMap:
      name: codemie-customer-config

# -- Array of extra Kubernetes manifests to deploy
extraObjects: []
