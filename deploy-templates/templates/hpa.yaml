{{- $pools := list
  (dict "name" (include "codemie.fullname" .)            "hpa" .Values.hpa           "rollout" .Values.argoRollout.enabled           "enabled" true)
  (dict "name" (include "codemie.ds-pool.fullname" .)    "hpa" .Values.dsPool.hpa    "rollout" .Values.dsPool.argoRollout.enabled    "enabled" .Values.dsPool.enabled)
  (dict "name" (include "codemie.proxy-pool.fullname" .) "hpa" .Values.proxyPool.hpa "rollout" .Values.proxyPool.argoRollout.enabled "enabled" .Values.proxyPool.enabled)
-}}
{{- range $pool := $pools }}
{{- if and $pool.enabled $pool.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $pool.name }}
  labels:
    {{- include "codemie.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    {{- if $pool.rollout }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ $pool.name }}
  minReplicas: {{ $pool.hpa.minReplicas }}
  maxReplicas: {{ $pool.hpa.maxReplicas }}
  metrics:
  # Utilization is measured against the codemie container's own CPU request,
  # so sidecars do not dilute the signal.
  - type: ContainerResource
    containerResource:
      name: cpu
      container: {{ $.Chart.Name }}
      target:
        type: Utilization
        averageUtilization: {{ $pool.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $pool.hpa.scaleUpStabilizationWindowSeconds }}
      policies:
      - type: Pods
        value: {{ $pool.hpa.scaleUpPolicyPods }}
        periodSeconds: {{ $pool.hpa.scaleUpPolicyPeriodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ $pool.hpa.scaleDownStabilizationWindowSeconds }}
      policies:
      - type: Pods
        value: {{ $pool.hpa.scaleDownPolicyPods }}
        periodSeconds: {{ $pool.hpa.scaleDownPolicyPeriodSeconds }}
{{- end }}
{{- end }}
