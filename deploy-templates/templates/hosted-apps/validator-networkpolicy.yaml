{{- $hostedApps := index .Values.features.tools "hosted-apps" }}
{{- if and $hostedApps.enabled $hostedApps.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "codemie.hostedValidator.name" . }}
  namespace: {{ $hostedApps.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "codemie.hostedValidator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "codemie.hostedValidator.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "codemie.selectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with $hostedApps.networkPolicy.egress.dns }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "codemie.hostedClamd.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ $hostedApps.clamd.port }}
          protocol: TCP
{{- end }}
