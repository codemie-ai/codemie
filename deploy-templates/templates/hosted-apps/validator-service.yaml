{{- $hostedApps := index .Values.features.tools "hosted-apps" }}
{{- if $hostedApps.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codemie.hostedValidator.name" . }}
  namespace: {{ $hostedApps.namespace.name | default .Release.Namespace }}
  labels:
    {{- include "codemie.hostedValidator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "codemie.hostedValidator.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8091
      targetPort: http
{{- end }}
